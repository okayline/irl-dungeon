<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>irl-dungeon</title>
<style>
  /* VT323, self-hosted (fonts/OFL.txt has its license). */
  @font-face { font-family: "VT323"; src: url("fonts/VT323-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
  :root { --bg: #07090a; --fg: #e4e4df; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    font-family: "VT323", ui-monospace, Menlo, Consolas, monospace; font-variant-ligatures: none;
    -webkit-user-select: none; user-select: none;
  }
  .frame { max-width: 100%; overflow-x: auto; }
  pre { margin: 0; font-family: inherit; line-height: 1.05; font-size: clamp(6px, calc((100vw - 32px) / 49), 22px); white-space: pre; }
  /* From daily-dungeon: glyphs the screen font lacks are boxed to exact grid cells so the frame stays straight. */
  .cell { display: inline-block; width: 1ch; text-align: center; overflow: visible; white-space: nowrap; }
  .cell .g { font-family: "DejaVu Sans Mono", Menlo, Consolas, "Segoe UI Symbol", monospace; line-height: 0; }
  .ph .g { display: inline-block; transform: scale(1.3, 0.62); }
  .kanji { display: inline-block; width: 2ch; text-align: center; overflow: visible; white-space: nowrap; }
  .kanji .g { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "MS Gothic", sans-serif; line-height: 0; font-size: 0.8em; }
</style>
</head>
<body>
<div class="frame"><pre id="screen">LOADING...</pre></div>
<script src="https://cdn.jsdelivr.net/npm/h3-js@4.1.0/dist/h3-js.umd.js"></script>
<script src="screen.js"></script>
<script src="wing.js"></script>
<script src="game.js"></script>
</body>
</html>
