<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>irl-dungeon</title>
<style>
  /* VT323, self-hosted (fonts/OFL.txt has its license). Same screen styling as 4Dungeon. */
  @font-face { font-family: "VT323"; src: url("fonts/VT323-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
  :root { --bg: #07090a; --fg: #e4e4df; --dim: #4f5d52; --trail: #8f8f8a; --bright: #ffffff; --moon: #9fc4ff; --gold: #e3b341; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { -webkit-user-select: none; user-select: none; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    font-family: "VT323", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-variant-ligatures: none; }
  .frame { max-width: 100%; overflow-x: auto; position: relative; }
  pre { margin: 0; font-family: inherit; line-height: 1.05; font-size: clamp(6px, calc((100vw - 32px) / 49), 22px);
    white-space: pre; text-shadow: 0 0 4px rgba(228, 228, 223, 0.2); }
  .you { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .moon { color: var(--moon); }
  .door { color: var(--trail); }
  .wall { color: var(--dim); opacity: 0.6; }   /* the outline of the rooms you've been in: 4Dungeon's */
  .btn { cursor: pointer; color: var(--bright); }
  .btn:hover { background: var(--fg); color: var(--bg); }
  /* The weekday kanji takes exactly two character cells, so the frame stays straight. */
  .kanji { display: inline-block; width: 2ch; text-align: center; overflow: visible; white-space: nowrap; }
  .kanji .g { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "MS Gothic", sans-serif; line-height: 0; font-size: 0.8em; }
  .cell { display: inline-block; width: 1ch; text-align: center; overflow: visible; white-space: nowrap; }
  /* The build number, small, under the screen's lower right corner (as in 4Dungeon). */
  .ver { text-align: right; font-size: 12px; line-height: 14px; color: var(--trail); padding: 2px 1ch 0 0; letter-spacing: 0.05em; }
  .gold { color: var(--gold); }
  .dim { color: var(--trail); }
  .code { font-weight: bold; letter-spacing: .04em; word-break: break-all; }
  /* The SAVE panel sits inside the 3D view (rows 6-22, columns 1-47), like 4Dungeon's bag; placeInView() sizes it. It scrolls;
     the title row stays at the top and the message row at the foot. */
  .viewpop { position: absolute; background: var(--bg); overflow: auto; box-sizing: border-box; outline: 1px solid var(--trail); }
  .viewpop pre { white-space: pre-wrap; display: flex; flex-direction: column; min-height: 100%; margin: 0; }
  .viewpop pre > div { flex: none; }
  .viewpop .top { position: sticky; top: 0; background: var(--bg); padding-top: 0.5em; }
    .viewpop .code { -webkit-user-select: text; user-select: text; }
  .viewpop .btn { display: inline-block; }
  .foundpic { image-rendering: pixelated; width: 88px; height: 31px; margin: 0.4em 0; display: block; }
  .codebox { font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--trail); width: 26ch; padding: 0 4px; text-transform: uppercase; }
  .cell .g { font-family: "DejaVu Sans Mono", Menlo, Consolas, "Segoe UI Symbol", monospace; line-height: 0; }
</style>
</head>
<body>
  <div class="frame"><pre id="screen">LOADING...</pre>
    <div id="save" class="viewpop" role="dialog" aria-modal="true" aria-label="Save codes and passkeys" hidden><pre></pre></div><div id="found" class="viewpop" role="dialog" aria-modal="true" aria-label="You found something" hidden><pre></pre></div><div id="invoke" class="viewpop" role="dialog" aria-modal="true" aria-label="Your finds" hidden><pre></pre></div><div id="ver" class="ver"></div></div>
<script type="module">
  import { renderScreen, VERSION, WORD } from "./screen.js";
  import { turn } from "./walk.js";
  import { arrive, load, forward, turned, firstLine, signHere, unsignHere, loadArea } from "./play.js";
  import FLOOR from "./floor.js";
  import { isCell, locate, neighbour } from "./place.js";
  import { openSave, api } from "./account.js";
  import { openFound } from "./found.js";
  import { openInvoke } from "./invoke.js";
  import { areaMap } from "./area.js";

  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const tz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return "Pacific/Honolulu"; } })();

  // The first cell is ?cell=<id> if the address has one, or else the server's rough guess from the connection (GET
  // /api/here: the centre of a ~1 km area, no prompt, nothing stored). From there the player walks out of a cell's start
  // room into the next one. L uses the browser's position instead, where the browser allows it; its coordinates are
  // turned into a cell id at once and dropped. The server only ever sees cell ids.
  const fromAddress = (new URLSearchParams(location.search).get("cell") || "").toLowerCase();

  let st = { tz, log: "" };
  // Arriving builds the cell's floor at once, then asks the server for this player's doors in it (src/worker.js).
  function arriveAt(cell, log = "> You arrive.", facing, came) {
    const zoom = st.zoom;
    st = arrive(cell, { tz, log, zoom, ...(facing ? { facing } : {}), ...(came ? { came } : {}) });
    if (zoom === "area") { const here = st; loadArea(st, api).then(s => { if (st.cell === here.cell) { st = { ...st, area: s.area }; draw(); } }); }
    const here = st;
    load(st, api).then(s => { if (st.cell === here.cell && st.floor === here.floor) { const visited = st.visited.slice(); s.visited.forEach((v, i) => { if (v) visited[i] = true; }); st = { ...s, at: st.at, visited, facing: st.facing, zoom: st.zoom, area: st.area, log: s.log === here.log ? st.log : s.log }; draw(); } });
  }
  if (isCell(fromAddress)) arriveAt(fromAddress);
  else fetch("/api/here").then(r => r.json()).then(d => {
    if (!st.cell && d && isCell(d.cell)) { arriveAt(d.cell, "> You arrive somewhere near. Walk out of this first room to find your street."); draw(); }
  }).catch(() => {});

  let locating = false;
  async function where() {
    if (locating) return;
    locating = true; st = { ...st, log: "> Finding you..." }; draw();
    try { const cell = await locate(); if (cell === st.cell) st = { ...st, log: "> You are still here." }; else arriveAt(cell); }
    catch (e) { st = { ...st, log: "> " + e.message }; }
    locating = false; draw();
  }

  // Colors: only the things 4Dungeon colors on this screen: your @, the locked-door #, the moon, and the buttons.
  // Every character outside plain ASCII sits in a box exactly one cell wide (a kanji, two), so the frame stays
  // straight whatever font the browser falls back to for it.
  const boxed = html => html.replace(/[\u3040-\u30ff\u4e00-\u9fff]/g, c => `<span class="kanji"><span class="g">${c}</span></span>`)
    .replace(/[^\x00-\x7f]/g, c => `<span class="cell${/[░▓█]/.test(c) ? " moon" : ""}"><span class="g">${c}</span></span>`);
  // The minimap rows, colored as 4Dungeon does: the outline (+ - |) dim, your @ and facing arrow bright, a locked # grey.
  // [^] [v] inside brackets are marks, not arrows. The panel's own edges are left alone.
  function mapColor(right) {
    let out = "", k = 0;
    const re = /[\[)][\^v][\](]|[@^v<>#:=*+\-|]/g; let m;
    while ((m = re.exec(right))) {
      out += esc(right.slice(k, m.index)); k = m.index + m[0].length;
      const at = m.index, ch = m[0];
      if (ch.length === 3) out += esc(ch);
      else if (/[+\-|]/.test(ch)) out += at === 0 || at === right.length - 1 ? ch : `<span class="wall">${ch}</span>`;
      else out += `<span class="${ch === "#" || ch === ":" || ch === "=" || ch === "*" ? "door" : "you"}">${esc(ch)}</span>`;
    }
    return out + esc(right.slice(k));
  }
  function colorize(text) {
    return text.split("\n").map((line, i) => {
      if (i >= 1 && i <= 4) return boxed(i === 2 ? esc(line).replace(/[()O]+/g, m => `<span class="moon">${m}</span>`) : esc(line));
      if (i >= 6 && i <= 22) {
        const l = line.slice(0, 49), r = line.slice(49);
        const L = esc(l).replace("[ &lt; ]", '<span class="btn" data-act="L">[ &lt; ]</span>').replace("[ &gt; ]", '<span class="btn" data-act="R">[ &gt; ]</span>').replace("[  ^  ]", '<span class="btn" data-act="W">[  ^  ]</span>');
        const R = (i - 6 >= 9 && i - 6 <= 13 ? mapColor(r) : esc(r)).replace("[-]", '<span class="btn" data-act="Z">[-]</span>').replace("[+]", '<span class="btn" data-act="Z">[+]</span>').replace("[Y] SIGN IT", '<span class="btn" data-act="Y">[Y] SIGN IT</span>').replace("[U] UNSIGN", '<span class="btn" data-act="U">[U] UNSIGN</span>');
        return L + R;
      }
      if (i === 28) return boxed(esc(line)).replace("[I]NVOKE", '<span class="btn" data-act="I">[I]NVOKE</span>').replace("[L]OCATE", '<span class="btn" data-act="G">[L]OCATE</span>').replace("[S]AVE", '<span class="btn" data-act="S">[S]AVE</span>');
      return boxed(esc(line));
    }).join("\n");
  }

  function draw() {
    if (st.floor) { st.map = st.zoom === "area" ? areaMap(st.area) : FLOOR.minimap(st.floor, st); st.first = firstLine(st); }
    document.getElementById("screen").innerHTML = colorize(renderScreen(st, new Date()));
  }
  let savePanel = null;
  const saveOpen = () => !document.getElementById("save").hidden;
  // Size the panel to the 3D view: one column in, six rows down, 47 columns by 17 rows (the same arithmetic as 4Dungeon).
  function placeInView(box) {
    const scr = document.getElementById("screen"), r = scr.getBoundingClientRect();
    const rows = scr.textContent.split("\n").length, rh = r.height / rows, cw = r.width / 80;
    Object.assign(box.style, { left: scr.offsetLeft + cw + "px", top: scr.offsetTop + 6 * rh + "px", width: 47 * cw + "px", height: 17 * rh + "px", padding: `0 ${cw}px ${rh / 2}px` });   // no top padding: the pinned head sits flush, so nothing shows above it
  }
  const foundOpen = () => !document.getElementById("found").hidden;
  const invokeOpen = () => !document.getElementById("invoke").hidden;
  let invokePanel = null;
  function openInvokePanel() { if (invokeOpen()) return; const box = document.getElementById("invoke"); placeInView(box); invokePanel = openInvoke(box, { fetchApi: api, onClose: () => { invokePanel = null; draw(); } }); }
  addEventListener("resize", () => { if (saveOpen()) placeInView(document.getElementById("save")); if (foundOpen()) placeInView(document.getElementById("found")); if (invokeOpen()) placeInView(document.getElementById("invoke")); });
  // A find is a window over the view: "You found X!". Enter, Escape, a click or [OK] closes it.
  let foundPanel = null;
  function showFound(item) { const box = document.getElementById("found"); placeInView(box); foundPanel = openFound(box, item, () => { foundPanel = null; draw(); }); }
  function openSavePanel() {
    if (saveOpen()) return;
    const box = document.getElementById("save"); box.hidden = false; placeInView(box);
    savePanel = openSave(box, { onClose: () => { savePanel = null; }, cell: () => st.cell || null, onGo: (c) => { arriveAt(c, "> You go to a saved cell."); draw(); }, onTest: (on, back) => { const c = on ? st.cell : back || st.cell; if (c) { arriveAt(c, on ? "> Test mode. Nothing here counts." : "> Test mode off. You're back where you started."); draw(); } } });
  }
  let busy = false;      // one step at a time: a step may wait for the server
  function act(a) {
    if (foundOpen() || invokeOpen()) return;
    if (a === "I") return openInvokePanel();
    if (a === "Z") { st = { ...st, zoom: st.zoom === "area" ? "room" : "area" }; draw(); return st.zoom === "area" ? loadArea(st, api).then(s => { if (s.cell === st.cell) { st = { ...st, area: s.area }; draw(); } }) : undefined; }
    if (a === "S") return openSavePanel(); if (a === "G") return where();
    if (busy) return;
    if (a === "Y" || a === "U") { busy = true; return (a === "Y" ? signHere : unsignHere)(st, api).then(s => { busy = false; st = s; draw(); }); }
    if (a !== "W") { st = turned(turn(st, a)); return draw(); }
    busy = true;
    forward(st, api).then(s => {
      busy = false; st = s;
      if (st.popup) { const item = st.popup; st = { ...st, popup: undefined }; showFound(item); }
      if (st.zoom === "area" && !st.leave) loadArea(st, api).then(s => { if (s.cell === st.cell) { st = { ...st, area: s.area }; draw(); } });     // a wing walked in full changes the marks
      if (st.leave) { const dir = st.leave; arriveAt(neighbour(st.cell, dir), `> You walk out ${WORD[dir]}, along the hallway into the next cell.`, dir, { N: "S", S: "N", E: "W", W: "E" }[dir]); }
      draw();
    });
  }
  document.getElementById("screen").addEventListener("click", e => { const a = e.target.closest && e.target.closest("[data-act]"); if (a) act(a.dataset.act); });
  addEventListener("keydown", e => {
    if (invokeOpen()) { if (["Escape", "Enter", " ", "i", "I"].includes(e.key)) { e.preventDefault(); invokePanel && invokePanel.close(); } return; }
    if (foundOpen()) { if (["Escape", "Enter", " "].includes(e.key)) { e.preventDefault(); foundPanel && foundPanel.close(); } return; }
    if (saveOpen()) { if (e.key === "Escape" && savePanel) savePanel.close(); return; }     // the SAVE panel has the keyboard
    const k = { ArrowLeft: "L", a: "L", A: "L", ArrowRight: "R", d: "R", D: "R", "+": "Z", "=": "Z", "-": "Z", z: "Z", Z: "Z", ArrowUp: "W", w: "W", W: "W", l: "G", L: "G", s: "S", S: "S", i: "I", I: "I", y: "Y", Y: "Y", u: "U", U: "U" }[e.key];
    if (k && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); act(k); }
  });
  document.getElementById("ver").textContent = VERSION;
  draw();
  setInterval(draw, 30000);   // the header clock
</script>
</body>
</html>
